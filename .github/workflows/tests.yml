name: Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ddev/github-action-setup-ddev@v1
        with:
          version: "1.24.4"
          autostart: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Clean-install integration tests
        run: ddev test --suite=all --fail-on-skipped
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          include-hidden-files: true
          path: |
            .cache/cpnav-performance.json
            playwright-report/
            test-results/
            .cache/verbb-tests/latest.log
            .cache/verbb-tests/junit.xml
            .cache/verbb-tests/result.json
            .cache/verbb-tests/app/storage/logs/
